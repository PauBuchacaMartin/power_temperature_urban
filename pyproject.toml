[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "consum-temperatura"
version = "0.4.1"
description = "Response of urban electricity consumption to temperature (article 1 of the thesis 'The city observed through its responses')"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Pau Buchaca"}]
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "requests"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
